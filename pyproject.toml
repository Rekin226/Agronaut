[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agronaut"
version = "1.0.0"
description = "Cited, deterministic aquaponics and hydroponics design with a conversational agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Abdoul Rachid Ouédraogo", email = "abdoulrachid03@gmail.com" }]
keywords = ["aquaponics", "hydroponics", "agriculture", "food security", "digital public good"]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/Rekin226/Agronaut"
Source = "https://github.com/Rekin226/Agronaut"

[project.scripts]
agronaut = "agronaut_agent.cli:main"

[tool.setuptools.dynamic]
# requirement.txt stays the single source of truth — it is what the Dockerfile and CI install.
dependencies = { file = ["requirement.txt"] }

[tool.setuptools]
# bot.py and app.py sit at the project root as scripts, not inside a package; `agronaut bot`
# and `agronaut web` need them installed alongside the packages.
py-modules = ["bot", "app"]
# Explicitly off. Left on, it combines with a stale agronaut.egg-info/SOURCES.txt in the
# working tree to sweep everything under a package dir into the wheel — that is how 54 test
# files ended up shipped to site-packages.
include-package-data = false

[tool.setuptools.packages.find]
include = ["agronaut_agent*", "agent*", "aqua_model*", "srcs*", "skills*", "scripts*"]
# Tests are for the checkout, not for site-packages.
exclude = ["*.tests", "*.tests.*"]

# The cited knowledge base is not optional decoration — without it every answer comes back
# KNOWLEDGE_UNAVAILABLE while the assistant still sounds confident. It lives at the repo
# root rather than inside a package, so it ships as data files and agronaut_agent/paths.py
# looks for it under sys.prefix when the source tree is not there.
[tool.setuptools.data-files]
"share/agronaut" = ["urls.txt"]
"share/agronaut/knowledge" = ["knowledge/*.md"]

[tool.ruff]
# Pinned here rather than passed on the CI command line, so a local `ruff check`
# and the blocking CI job cannot disagree about what "clean" means.
line-length = 95

[tool.ruff.lint]
# The set the tree is actually kept green under (#76). Ruff's own defaults drift
# between releases — 0.16 reports ~275 findings here under no explicit selection —
# so the list is spelled out and widened deliberately, never by upgrading ruff.
#   E4/E7/E9 pycodestyle errors, F pyflakes, I import order
select = ["E4", "E7", "E9", "F", "I"]
