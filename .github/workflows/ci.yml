name: CI

# Two jobs on purpose. `trust-zone` proves the claim the whole project rests on: the
# deterministic engineering core is testable with almost no dependencies and no model server.
# If that job ever needs an LLM library to pass, the trust boundary has leaked and CI says so.
# `full-suite` then covers the agent, channels and UI layers.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trust-zone:
    name: Trust zone (no LLM stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # This repo's file is requirement.txt (singular) — setup-python's default glob
          # looks for requirements.txt/pyproject.toml and hard-fails when it matches nothing.
          cache-dependency-path: requirement.txt

      # Deliberately NOT requirement.txt. aqua_model is pure Python; these three are all it
      # needs (pandas for the empirical dataset loader, Pillow for the PNG schematic).
      - name: Install minimal deps
        run: python -m pip install --upgrade pip pytest pandas Pillow

      - name: Deterministic core tests
        run: python -m pytest aqua_model/tests -q

      - name: Assert the core imports without any LLM library
        run: |
          python - <<'PY'
          import sys, importlib
          importlib.import_module("aqua_model")
          leaked = sorted(m for m in sys.modules
                          if m.split(".")[0] in {"langchain", "langchain_core", "transformers",
                                                 "torch", "streamlit", "telegram", "faiss"})
          if leaked:
              sys.exit(f"trust boundary leaked — aqua_model pulled in: {leaked}")
          print("aqua_model imports clean: no LLM/UI library required")
          PY

  full-suite:
    name: Full suite + advice-safety golden set
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version the package actually admits. `requires-python = ">=3.11"` lets pip
        # install onto anything from 3.11 up, and the classifiers advertise through 3.14, so
        # testing a subset of that means shipping a promise nothing checks. 3.14 is also the
        # maintainer's daily interpreter: leaving it out meant the machine the code is
        # written on was the one CI never saw.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirement.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirement.txt
          python -m pip install pytest

      - name: Test suite
        run: python -m pytest -q

      # The honesty gate. Hermetic by charter — no LLM, no network — and it exits non-zero if
      # any CRITICAL probe fails: a trust-gate bypass, a design that stops citing its
      # coefficients, a vision guard that stops stripping a fabricated reading.
      - name: Advice-safety golden set
        run: python -m scripts.safety_eval

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # This repo's file is requirement.txt (singular) — setup-python's default glob
          # looks for requirements.txt/pyproject.toml and hard-fails when it matches nothing.
          cache-dependency-path: requirement.txt
      # Pinned: ruff's default ruleset widens between releases, and an unpinned upgrade
      # would turn this job red on code nobody touched. Bump it deliberately.
      - run: python -m pip install --upgrade pip && python -m pip install ruff==0.16.3
      # Blocking. The ruleset lives in pyproject.toml so this and a local `ruff check`
      # cannot disagree; widening it is a deliberate edit there, not a flag here.
      - name: Style (blocking)
        run: ruff check --output-format=github .

  first-run:
    name: First-run (no credentials)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # Walk the no-credentials path: version, doctor, and sizing all work with no API key
      # or configuration. A broken first-run was the common failure before this job existed
      # (setup wizard exiting without a command to type; doctor missing because only the
      # editable install was tested; --version reporting frozen metadata instead of running code).
      - name: Install from wheel and verify no-credentials path
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --quiet dist/*.whl
          cd /tmp                                   # nothing importable from the checkout here

          # --version reports the code that is actually running, not a frozen copy.
          /tmp/fresh/bin/agronaut --version

          # doctor names what is missing when nothing is configured; it must not throw.
          /tmp/fresh/bin/agronaut doctor

          # sizing works without any model: validated input in, cited sizing out.
          /tmp/fresh/bin/agronaut size --fish tilapia --crop lettuce \
            --area 12 --temp 27 --water 3000

      # A stubbed model-backed turn: start a tiny HTTP server that returns a canned
      # OpenAI-compatible chat completion with a tool call, then ask the agent to run
      # it end-to-end. This catches the path that real users hit — a working install
      # that cannot reach an answer because the model layer is broken.
      - name: Stubbed model turn (hermetic)
        run: |
          python -m venv /tmp/fresh-model
          /tmp/fresh-model/bin/pip install --quiet dist/*.whl

          # The stub returns a minimal tool-calling response that agronaut can parse.
          cat > /tmp/llm_stub.py << 'STUB'
          import http.server, json, threading

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  body = json.loads(self.rfile.read())
                  resp = {
                      "model": "stub",
                      "choices": [{
                          "message": {
                              "role": "assistant",
                              "content": None,
                              "tool_calls": [{
                                  "id": "call_1",
                                  "type": "function",
                                  "function": {
                                      "name": "size_aquaponics_system",
                                      "arguments": json.dumps({
                                          "fish": "tilapia",
                                          "crop": "lettuce",
                                          "area": 12,
                                          "temp": 27,
                                          "water": 3000
                                      })
                                  }
                              }]
                          }
                      }]
                  }
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.end_headers()
                  self.wfile.write(json.dumps(resp).encode())

              def log_message(self, *a):
                  pass  # silence logs

          srv = http.server.HTTPServer(("127.0.0.1", 18765), Handler)
          threading.Thread(target=srv.handle_request, daemon=True).start()
          # Keep alive so the test script can reach it.
          import time; time.sleep(30)
          STUB

          /tmp/fresh-model/bin/python /tmp/llm_stub.py &
          STUB_PID=$!
          sleep 1

          # Point the agent at the stub via the openai_compat path.
          /tmp/fresh-model/bin/python - <<'PY'
          import os, sys
          os.environ["LLM_PROVIDER"] = "openai_compat"
          os.environ["OPENAI_COMPAT_BASE_URL"] = "http://127.0.0.1:18765/v1"
          os.environ["OPENAI_COMPAT_MODEL"] = "stub"

          from agent.llm import resolve_llm
          llm = resolve_llm()
          # The stub responds with a tool call for size_aquaponics_system,
          # which the agent can execute against the deterministic core.
          result = llm.invoke("size a system for tilapia and lettuce, 12 m2, 27C, 3000L")
          print(f"stub turn: {type(result).__name__}")
          assert result is not None, "agent returned None from stub turn"
          PY

          kill $STUB_PID 2>/dev/null || true
