name: CI

# Two jobs on purpose. `trust-zone` proves the claim the whole project rests on: the
# deterministic engineering core is testable with almost no dependencies and no model server.
# If that job ever needs an LLM library to pass, the trust boundary has leaked and CI says so.
# `full-suite` then covers the agent, channels and UI layers.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trust-zone:
    name: Trust zone (no LLM stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # This repo's file is requirement.txt (singular) — setup-python's default glob
          # looks for requirements.txt/pyproject.toml and hard-fails when it matches nothing.
          cache-dependency-path: requirement.txt

      # Deliberately NOT requirement.txt. aqua_model is pure Python; these three are all it
      # needs (pandas for the empirical dataset loader, Pillow for the PNG schematic).
      - name: Install minimal deps
        run: python -m pip install --upgrade pip pytest pandas Pillow

      - name: Deterministic core tests
        run: python -m pytest aqua_model/tests -q

      - name: Assert the core imports without any LLM library
        run: |
          python - <<'PY'
          import sys, importlib
          importlib.import_module("aqua_model")
          leaked = sorted(m for m in sys.modules
                          if m.split(".")[0] in {"langchain", "langchain_core", "transformers",
                                                 "torch", "streamlit", "telegram", "faiss"})
          if leaked:
              sys.exit(f"trust boundary leaked — aqua_model pulled in: {leaked}")
          print("aqua_model imports clean: no LLM/UI library required")
          PY

  full-suite:
    name: Full suite + advice-safety golden set
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version the package actually admits. `requires-python = ">=3.11"` lets pip
        # install onto anything from 3.11 up, and the classifiers advertise through 3.14, so
        # testing a subset of that means shipping a promise nothing checks. 3.14 is also the
        # maintainer's daily interpreter: leaving it out meant the machine the code is
        # written on was the one CI never saw.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirement.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirement.txt
          python -m pip install pytest

      - name: Test suite
        run: python -m pytest -q

      # The honesty gate. Hermetic by charter — no LLM, no network — and it exits non-zero if
      # any CRITICAL probe fails: a trust-gate bypass, a design that stops citing its
      # coefficients, a vision guard that stops stripping a fabricated reading.
      - name: Advice-safety golden set
        run: python -m scripts.safety_eval

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # This repo's file is requirement.txt (singular) — setup-python's default glob
          # looks for requirements.txt/pyproject.toml and hard-fails when it matches nothing.
          cache-dependency-path: requirement.txt
      # Pinned: ruff's default ruleset widens between releases, and an unpinned upgrade
      # would turn this job red on code nobody touched. Bump it deliberately.
      - run: python -m pip install --upgrade pip && python -m pip install ruff==0.16.3
      # Blocking. The ruleset lives in pyproject.toml so this and a local `ruff check`
      # cannot disagree; widening it is a deliberate edit there, not a flag here.
      - name: Style (blocking)
        run: ruff check --output-format=github .

  first-run:
    name: First-run (no credentials)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # Walk the no-credentials path: version, doctor, and sizing all work with no API key
      # or configuration. A broken first-run was the common failure before this job existed
      # (setup wizard exiting without a command to type; doctor missing because only the
      # editable install was tested; --version reporting frozen metadata instead of running code).
      - name: Install from wheel and verify no-credentials path
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --quiet dist/*.whl
          cd /tmp                                   # nothing importable from the checkout here

          # --version reports the code that is actually running, not a frozen copy.
          # Assert the site-packages path: an editable/frozen install would not print one.
          VERSION_OUT=$(/tmp/fresh/bin/agronaut --version 2>&1)
          echo "$VERSION_OUT"
          echo "$VERSION_OUT" | grep -q "site-packages" \
            || { echo "--version did not report a site-packages install:"; echo "$VERSION_OUT"; exit 1; }

          # doctor names what is missing when nothing is configured; it must not throw.
          DOCTOR_OUT=$(/tmp/fresh/bin/agronaut doctor 2>&1)
          echo "$DOCTOR_OUT"
          echo "$DOCTOR_OUT" | grep -q "no model provider configured" \
            || { echo "doctor did not name the missing model provider:"; echo "$DOCTOR_OUT"; exit 1; }

          # sizing works without any model: validated input in, cited sizing out.
          /tmp/fresh/bin/agronaut size --fish tilapia --crop lettuce \
            --area 12 --temp 27 --water 3000
      # A stubbed model-backed turn: a tiny HTTP server answers the OpenAI-compatible
      # requests the agent makes. A real turn is TWO requests — the tool call, then the
      # final answer after the tool result — so the stub switches on whether the request
      # already carries a `role: "tool"` message. The second response quotes the tool's
      # own output, so the assertion checks the deterministic core actually ran (a bare
      # `is not None` would pass on any debris).
      - name: Stubbed model turn (hermetic)
        run: |
          python -m venv /tmp/fresh-model
          /tmp/fresh-model/bin/pip install --quiet dist/*.whl
          # openai_compat is the self-hosted backend path, so langchain-openai is an
          # optional extra, not a wheel dependency — install it into this venv directly.
          /tmp/fresh-model/bin/pip install --quiet langchain-openai

          cat > /tmp/llm_stub.py << 'STUB'
          import json
          import threading
          from http.server import BaseHTTPRequestHandler, HTTPServer

          ARGS = {
              "fish_species": "tilapia",
              "crop": "lettuce",
              "grow_area_m2": 12,
              "temperature_c": 27,
              "water_budget_lpd": 3000,
          }

          class Handler(BaseHTTPRequestHandler):
              def do_POST(self):
                  body = json.loads(self.rfile.read(int(self.headers["Content-Length"])))
                  msgs = body.get("messages", [])
                  has_tool_result = any(m.get("role") == "tool" for m in msgs)
                  if has_tool_result:
                      # Second request: the tool already ran. Echo a string only the
                      # deterministic sizing core would produce.
                      tool_text = next(m["content"] for m in msgs if m.get("role") == "tool")
                      marker = "grow_area" if "grow_area" in tool_text else tool_text[:60]
                      content = f"Sizing complete for your tilapia + lettuce raft: {marker}"
                  else:
                      content = None
                  resp = {"model": "stub", "choices": [{"message": {
                      "role": "assistant",
                      "content": content,
                      **({} if content is not None else {
                          "tool_calls": [{
                              "id": "call_1",
                              "type": "function",
                              "function": {
                                  "name": "size_aquaponics_system",
                                  "arguments": json.dumps(ARGS),
                              },
                          }]
                      }),
                  }}]}
                  payload = json.dumps(resp).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(payload)))
                  self.end_headers()
                  self.wfile.write(payload)

              def log_message(self, *a):
                  pass

          HTTPServer(("127.0.0.1", 18923), Handler).serve_forever()
          STUB

          /tmp/fresh-model/bin/python /tmp/llm_stub.py &
          STUB_PID=$!
          sleep 1

          # Run the turn from outside the checkout so the installed wheel is what imports.
          cd /tmp
          LLM_PROVIDER=openai_compat \
          OPENAI_COMPAT_BASE_URL=http://127.0.0.1:18923/v1 \
          OPENAI_COMPAT_MODEL=stub \
          /tmp/fresh-model/bin/python - <<'PY'
          from agronaut_agent.core import AgronautAgent

          agent = AgronautAgent()
          reply = agent.handle_message("cli", "ci", "size a system for tilapia and lettuce, 12 m2, 27C, 3000 L")
          print(f"agent reply: {reply[:200]}")
          assert "Sizing complete" in reply, f"no real turn happened; reply was: {reply!r}"
          assert "FEASIBLE" in reply, f"sizing did not succeed; reply was: {reply!r}"
          assert "TOOL_ERROR" not in reply, f"tool call failed inside the turn: {reply!r}"
          PY

          kill $STUB_PID 2>/dev/null || true
