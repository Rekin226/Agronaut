name: Local model check

# Does the default Ollama model actually run Agronaut on a grower-sized machine? (#181)
#
# Manual only (Actions tab > Local model check > Run workflow). It pulls a multi-GB model and
# runs a real turn on CPU, so it is far too slow and too network-bound for every PR, and it
# is not one of the checks main requires.
#
# GitHub's standard Linux runner has 16 GB of RAM and no GPU: under Ollama's 24 GiB line, so
# Ollama would give it a 4K window by default, like a grower's laptop. That is the point of
# running it here rather than on the maintainer's 36 GiB Mac.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Ollama tag to test (blank = Agronaut's default)"
        required: false
        default: ""
      num_ctx:
        description: "Context window Agronaut requests (AGRONAUT_OLLAMA_NUM_CTX)"
        required: false
        default: "32768"

permissions:
  contents: read

jobs:
  check:
    name: One real turn through Ollama
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AGRONAUT_OLLAMA_NUM_CTX: ${{ inputs.num_ctx }}
      OLLAMA_HOST: 127.0.0.1:11434
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirement.txt

      - name: Install Agronaut
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirement.txt

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # The installer starts a system service; stop it and run our own, so the server
          # log (where truncation is reported) is ours to read.
          sudo systemctl stop ollama || true
          ollama --version

      - name: Start Ollama with debug logging
        run: |
          OLLAMA_DEBUG=1 nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/version && break; sleep 1; done

      - name: Pull the model
        env:
          # Through env, not interpolated into the script, so the typed tag cannot inject shell.
          MODEL_INPUT: ${{ inputs.model }}
        run: |
          MODEL="$MODEL_INPUT"
          if [ -z "$MODEL" ]; then
            MODEL=$(python -c "from agent.llm import DEFAULT_MODELS; print(DEFAULT_MODELS['ollama'])")
          fi
          echo "MODEL=$MODEL" >> "$GITHUB_ENV"
          ollama pull "$MODEL"

      - name: Run one Agronaut turn
        run: python -m scripts.local_model_check --model "$MODEL" --ollama-log ollama.log --save report.json

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: local-model-check
          path: |
            report.json
            ollama.log
          if-no-files-found: warn
